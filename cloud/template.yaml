AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Baruch auth API. Register, confirm, and login against a Cognito user pool.

Parameters:
  CorsOrigin:
    Type: String
    Default: '*'
    Description: Single browser origin allowed to call the API, or * for any origin.

Globals:
  Function:
    Runtime: python3.12
    Architectures:
      - arm64
    Timeout: 10
    MemorySize: 256
    CodeUri: src
    Tags:
      Project: baruch-iot-platform

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UsernameAttributes:
        - email
      UsernameConfiguration:
        CaseSensitive: false
      AutoVerifiedAttributes:
        - email
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireUppercase: true
          RequireNumbers: true
          RequireSymbols: true
      # Email is the username, so Cognito already requires it. Do not repeat it here.
      Schema:
        - Name: name
          AttributeDataType: String
          Mutable: true
          Required: true
      LambdaConfig:
        PostConfirmation: !GetAtt PostConfirmationFunction.Arn
      UserAttributeUpdateSettings:
        AttributesRequireVerificationBeforeUpdate:
          - email

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-auth'
      UserPoolId: !Ref UserPool
      GenerateSecret: true
      PreventUserExistenceErrors: ENABLED
      ExplicitAuthFlows:
        - ALLOW_ADMIN_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      SupportedIdentityProviders:
        - COGNITO
      AllowedOAuthFlowsUserPoolClient: false
      ReadAttributes:
        - email
        - name
      WriteAttributes:
        - email
        - name

  OperatorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Operator
      Description: Fleet operators. Self-service registration joins this group.
      Precedence: 10

  AdministratorGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      UserPoolId: !Ref UserPool
      GroupName: Administrator
      Description: Platform administrators. Assign membership outside self-service registration.
      Precedence: 1

  AuthApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: '$default'
      CorsConfiguration:
        AllowOrigins:
          - !Ref CorsOrigin
        AllowHeaders:
          - content-type
          - authorization
        AllowMethods:
          - GET
          - POST
          - OPTIONS
      DefaultRouteSettings:
        ThrottlingBurstLimit: 20
        ThrottlingRateLimit: 10
      Auth:
        Authorizers:
          CognitoJwt:
            IdentitySource: '$request.header.Authorization'
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${UserPool}'
              audience:
                - !Ref UserPoolClient

  # One row per BMS unit that left the factory. Keyed by serial number.
  BmsProductsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BmsProducts
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: serialNumber
          AttributeType: S
        - AttributeName: batchNumber
          AttributeType: S
        - AttributeName: status
          AttributeType: S
        - AttributeName: createdAt
          AttributeType: S
      KeySchema:
        - AttributeName: serialNumber
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: byBatch
          KeySchema:
            - AttributeName: batchNumber
              KeyType: HASH
            - AttributeName: serialNumber
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
        - IndexName: byStatus
          KeySchema:
            - AttributeName: status
              KeyType: HASH
            - AttributeName: createdAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: baruch-iot-platform

  # One row per year holding the last serial sequence issued. Incremented atomically.
  BmsSerialCountersTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BmsSerialCounters
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: counterId
          AttributeType: S
      KeySchema:
        - AttributeName: counterId
          KeyType: HASH
      Tags:
        - Key: Project
          Value: baruch-iot-platform

  # One row per action on a product or device. subjectId is a serial number or a device id.
  # Rows are written once and never changed.
  BmsAuditLogTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BmsAuditLog
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: subjectId
          AttributeType: S
        - AttributeName: occurredAt
          AttributeType: S
        - AttributeName: actorEmail
          AttributeType: S
      KeySchema:
        - AttributeName: subjectId
          KeyType: HASH
        - AttributeName: occurredAt
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: byActor
          KeySchema:
            - AttributeName: actorEmail
              KeyType: HASH
            - AttributeName: occurredAt
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: baruch-iot-platform

  CreateProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-create-product'
      Handler: products.create.handler
      Description: Issues the next BMS serial number, stores the unit, and logs who created it.
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref BmsProductsTable
          SERIAL_COUNTER_TABLE: !Ref BmsSerialCountersTable
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref BmsProductsTable
        - DynamoDBWritePolicy:
            TableName: !Ref BmsAuditLogTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BmsSerialCountersTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /products
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  GetProductFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-product'
      Handler: products.get.handler
      Description: Reads one BMS product by serial number.
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref BmsProductsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsProductsTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /products/{serialNumber}
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  ListProductsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-list-products'
      Handler: products.list.handler
      Description: Lists BMS products by batch or status.
      Environment:
        Variables:
          PRODUCTS_TABLE: !Ref BmsProductsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsProductsTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /products
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  ProductHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-product-history'
      Handler: products.history.handler
      Description: Lists every logged action on one BMS product, oldest first.
      Environment:
        Variables:
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsAuditLogTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /products/{serialNumber}/history
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  AuditByActorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-audit-by-actor'
      Handler: products.audit.handler
      Description: Lists what one user did across all products, newest first. Administrators only.
      Environment:
        Variables:
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsAuditLogTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /audit
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  # Encrypts each device's instant reading key at rest. Only the register function may encrypt.
  DeviceKeyEncryptionKey:
    Type: AWS::KMS::Key
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      Description: Encrypts BMS instant reading keys stored in the BmsDevices table.
      EnableKeyRotation: true
      KeyPolicy:
        Version: '2012-10-17'
        Statement:
          - Sid: AccountAdmin
            Effect: Allow
            Principal:
              AWS: !Sub 'arn:aws:iam::${AWS::AccountId}:root'
            Action: kms:*
            Resource: '*'

  DeviceKeyEncryptionKeyAlias:
    Type: AWS::KMS::Alias
    Properties:
      AliasName: !Sub 'alias/${AWS::StackName}-device-keys'
      TargetKeyId: !Ref DeviceKeyEncryptionKey

  # One row per provisioned BMS, ours or external. deviceId is a ULID; serialNumber is optional.
  BmsDevicesTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BmsDevices
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: deviceId
          AttributeType: S
        - AttributeName: serialNumber
          AttributeType: S
      KeySchema:
        - AttributeName: deviceId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Sparse: only factory units carry a serialNumber, so only they appear here.
        - IndexName: bySerial
          KeySchema:
            - AttributeName: serialNumber
              KeyType: HASH
          Projection:
            ProjectionType: ALL
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: true
      Tags:
        - Key: Project
          Value: baruch-iot-platform

  # One row per MAC address, pointing at its device. Written in the same transaction as the device
  # so a MAC can never be registered twice.
  BmsDeviceMacsTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      TableName: BmsDeviceMacs
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: macAddress
          AttributeType: S
      KeySchema:
        - AttributeName: macAddress
          KeyType: HASH
      Tags:
        - Key: Project
          Value: baruch-iot-platform

  RegisterDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-register-device'
      Handler: devices.register.handler
      Description: Registers a BMS with a MAC address, generating its device id and both keys.
      Environment:
        Variables:
          DEVICES_TABLE: !Ref BmsDevicesTable
          DEVICE_MACS_TABLE: !Ref BmsDeviceMacsTable
          PRODUCTS_TABLE: !Ref BmsProductsTable
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
          DEVICE_KEY_KMS_ARN: !GetAtt DeviceKeyEncryptionKey.Arn
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref BmsDevicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref BmsDeviceMacsTable
        - DynamoDBCrudPolicy:
            TableName: !Ref BmsProductsTable
        - DynamoDBWritePolicy:
            TableName: !Ref BmsAuditLogTable
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action: kms:Encrypt
              Resource: !GetAtt DeviceKeyEncryptionKey.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /devices
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  GetDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-get-device'
      Handler: devices.get.handler
      Description: Reads one device by id. Keys are never returned.
      Environment:
        Variables:
          DEVICES_TABLE: !Ref BmsDevicesTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsDevicesTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /devices/{deviceId}
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  FindDeviceFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-find-device'
      Handler: devices.find.handler
      Description: Finds a device by MAC address or serial number.
      Environment:
        Variables:
          DEVICES_TABLE: !Ref BmsDevicesTable
          DEVICE_MACS_TABLE: !Ref BmsDeviceMacsTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsDevicesTable
        - DynamoDBReadPolicy:
            TableName: !Ref BmsDeviceMacsTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /devices
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  RotateActivationKeyFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-rotate-activation-key'
      Handler: devices.rotate_key.handler
      Description: Issues a replacement activation key. The old key stops working.
      Environment:
        Variables:
          DEVICES_TABLE: !Ref BmsDevicesTable
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
      Policies:
        - DynamoDBWritePolicy:
            TableName: !Ref BmsDevicesTable
        - DynamoDBWritePolicy:
            TableName: !Ref BmsAuditLogTable
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /devices/{deviceId}/activation-key
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  DeviceHistoryFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-device-history'
      Handler: products.history.handler
      Description: Lists every logged action on one device, oldest first.
      Environment:
        Variables:
          AUDIT_LOG_TABLE: !Ref BmsAuditLogTable
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref BmsAuditLogTable
      Events:
        Get:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: GET
            Path: /devices/{deviceId}/history
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: CognitoJwt

  RegisterFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-register'
      Handler: auth.register.handler
      Description: Creates a Cognito user and sends an email confirmation code.
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USER_POOL_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:SignUp
              Resource: !GetAtt UserPool.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /auth/register
            PayloadFormatVersion: '2.0'

  ConfirmFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-confirm'
      Handler: auth.confirm.handler
      Description: Confirms a newly registered user with the emailed code.
      Environment:
        Variables:
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USER_POOL_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:ConfirmSignUp
              Resource: !GetAtt UserPool.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /auth/confirm
            PayloadFormatVersion: '2.0'

  LoginFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-login'
      Handler: auth.login.handler
      Description: Signs a confirmed user in and returns tokens plus their role.
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          USER_POOL_CLIENT_ID: !Ref UserPoolClient
          USER_POOL_CLIENT_SECRET: !GetAtt UserPoolClient.ClientSecret
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminInitiateAuth
                - cognito-idp:AdminListGroupsForUser
              Resource: !GetAtt UserPool.Arn
      Events:
        Post:
          Type: HttpApi
          Properties:
            ApiId: !Ref AuthApi
            Method: POST
            Path: /auth/login
            PayloadFormatVersion: '2.0'

  PostConfirmationRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole

  PostConfirmationFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub '${AWS::StackName}-post-confirmation'
      Handler: auth.post_confirmation.handler
      Description: Adds a confirmed self-service user to the Operator group.
      Role: !GetAtt PostConfirmationRole.Arn

  # Separate policy so this function does not depend on the user pool.
  # The user pool invokes the function, so an inline policy on the function would cycle.
  PostConfirmationCognitoPolicy:
    Type: AWS::IAM::Policy
    Properties:
      PolicyName: PostConfirmationCognito
      Roles:
        - !Ref PostConfirmationRole
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Action:
              - cognito-idp:AdminAddUserToGroup
              - cognito-idp:AdminListGroupsForUser
            Resource: !GetAtt UserPool.Arn

  PostConfirmationInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref PostConfirmationFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

Outputs:
  AuthApiUrl:
    Description: Base URL for the auth routes.
    Value: !GetAtt AuthApi.ApiEndpoint
  UserPoolId:
    Description: Cognito user pool id.
    Value: !Ref UserPool
  UserPoolClientId:
    Description: Cognito app client id. The client secret stays in the Lambda environment.
    Value: !Ref UserPoolClient
