AWSTemplateFormatVersion: '2010-09-09'
Description: >
  One-time setup. Lets GitHub Actions in one repository deploy the baruch-auth stack
  with short-lived credentials. No access keys are stored in GitHub.

Parameters:
  GitHubRepository:
    Type: String
    Default: binye-ultramax/baruch-iot-platform
    Description: GitHub owner/repo allowed to assume the deploy role.
  GitHubImmutableRepository:
    Type: String
    Default: binye-ultramax@268897201/baruch-iot-platform@1326517595
    Description: >
      Same repository in GitHub's immutable form owner@ownerId/repo@repoId. GitHub sends this
      form when "immutable subject" is enabled. Read it with:
      gh api repos/OWNER/REPO/actions/oidc/customization/sub
  GitHubBranch:
    Type: String
    Default: main
    Description: Branch whose workflow runs may deploy.
  AuthStackName:
    Type: String
    Default: baruch-auth
    Description: Name of the SAM stack the workflow deploys.

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList:
        - sts.amazonaws.com
      ThumbprintList:
        - 6938fd4d98bab03faadb97b34396831e3780aea1
        - 1c58a3a8518e8759bf075b76b750d4f2df264fcd

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub '${AuthStackName}-github-deploy'
      Description: Assumed by GitHub Actions to deploy the auth API.
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: !Ref GitHubOidcProvider
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub 'repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}'
                  - !Sub 'repo:${GitHubImmutableRepository}:ref:refs/heads/${GitHubBranch}'
      Policies:
        - PolicyName: DeployAuthStack
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: CloudFormation
                Effect: Allow
                Action:
                  - cloudformation:*
                Resource:
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/${AuthStackName}/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:${AWS::AccountId}:stack/aws-sam-cli-managed-default/*'
                  - !Sub 'arn:aws:cloudformation:${AWS::Region}:aws:transform/Serverless-2016-10-31'
              - Sid: CloudFormationRead
                Effect: Allow
                Action:
                  - cloudformation:ListStacks
                  - cloudformation:ValidateTemplate
                Resource: '*'
              - Sid: SamArtifactBucket
                Effect: Allow
                Action:
                  - s3:*
                Resource:
                  - 'arn:aws:s3:::aws-sam-cli-managed-default*'
                  - 'arn:aws:s3:::aws-sam-cli-managed-default*/*'
              - Sid: ServicesInStack
                Effect: Allow
                Action:
                  - lambda:*
                  - apigateway:*
                  - cognito-idp:*
                  - logs:*
                Resource: '*'
              - Sid: FunctionRoles
                Effect: Allow
                Action:
                  - iam:GetRole
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:UpdateRole
                  - iam:UpdateAssumeRolePolicy
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PassRole
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:PutRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:GetRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                Resource: !Sub 'arn:aws:iam::${AWS::AccountId}:role/${AuthStackName}-*'

Outputs:
  DeployRoleArn:
    Description: Set this as the GitHub repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
